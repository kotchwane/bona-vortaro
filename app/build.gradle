apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "io.github.kotchwane.bonavortaro"

    compileSdk = 37

    /* The articles, compressed with xz when the dictionary is built:
     * stored as they are, zip would only make them bigger */
    androidResources {
        noCompress += ['xz']
    }

    defaultConfig {
        /* The ID of this modified version, so that it can be installed
         * next to the original PReVo of the Play Store. The code keeps
         * its package (the namespace above). */
        applicationId = "io.github.kotchwane.bonavortaro"
        minSdk = 23
        targetSdk = 36
        /* Bona vortaro starts again from 0.1, like PReVo did in 2012:
         * it is a new app for Android, with its own ID. The code must go
         * up with every version given to anyone. */
        versionCode = 13
        versionName = "0.9"
    }

    /* The key, if there is one: the RELEASE_* properties in
     * ~/.gradle/gradle.properties. Without it (F-Droid, a fresh clone),
     * the release is built unsigned. */
    def releaseStoreFile = findProperty('RELEASE_STORE_FILE')
    def hasReleaseKey = releaseStoreFile != null && file(releaseStoreFile).exists()

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = findProperty('RELEASE_STORE_PASSWORD')
                keyAlias = findProperty('RELEASE_KEY_ALIAS')
                keyPassword = findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        compose = true
    }

    /* No encrypted list of the libraries, readable only by Google, in the
     * signature of the APKs: F-Droid refuses it. The bundle for Google
     * Play keeps it, Google reads it there */
    dependenciesInfo {
        includeInApk = false
    }

    buildTypes {
        release {
            /* In braces: F-Droid deletes the lines with "signingConfig",
             * and without them the next statement would become the
             * body of the "if" (minifyEnabled, then off on its side) */
            if (hasReleaseKey) {
                signingConfig = signingConfigs.release
            }
            /* R8: shrinks and optimises the code (asked by F-Droid). The
             * libraries bring their own rules; ours are in proguard-rules.pro */
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        /* Built like the release, to test its speed from Android Studio:
         * signed with the debug key, so that the Run button works without
         * the release key, and installed next to the app, not over it */
        profile {
            initWith release
            signingConfig = signingConfigs.debug
            applicationIdSuffix = ".profile"
            versionNameSuffix = "-profile"
            matchingFallbacks = ['release']
            profileable = true
        }
    }
}

dependencies {
    /* Reads the articles, compressed with xz (0BSD); the same version
     * compresses them, in the build script */
    implementation 'org.tukaani:xz:1.10'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}

def buildDictionary = tasks.register('buildDictionary', Exec) {
    /* Built again when prevodb, Reta Vortaro's data or its list of
     * Vikipedio articles change */
    inputs.dir rootProject.file('prevodb/src')
    inputs.dir rootProject.file('extern/revo-fonto/revo')
    inputs.dir rootProject.file('extern/revo-fonto/cfg')
    inputs.dir rootProject.file('extern/voko-grundo/cfg')
    inputs.file rootProject.file('data/vikiref.json')
    inputs.file rootProject.file('scripts/generate-dictionary.sh')
    outputs.dir 'src/main/assets/articles'
    outputs.dir 'src/main/assets/indices'
    outputs.file 'src/main/assets/officiality.txt'
    outputs.file 'src/main/assets/fields.txt'
    outputs.file 'src/main/assets/sources.txt'
    outputs.file 'src/main/assets/vikipedio.txt'
    outputs.file 'src/main/res/xml/languages.xml'

    commandLine rootProject.file('scripts/generate-dictionary.sh')

    /* Then the articles, compressed: prevodb writes them 64 to a file,
     * articles-XXX.bin, each made articles-XXX.xz. Settings of "xz -9e",
     * with a dictionary of 1 MiB, more than a file: the phone needs no
     * more memory to read one */
    doLast {
        def articles = file('src/main/assets/articles')
        articles.listFiles().findAll { it.name ==~ /articles-[0-9a-f]+\.bin/ }.sort { it.name }.each { bin ->
            def options = new org.tukaani.xz.LZMA2Options(9)
            options.setDictSize(1 << 20)
            options.setNiceLen(273)
            options.setDepthLimit(512)
            def xz = new File(articles, bin.name.replace('.bin', '.xz'))
            xz.withOutputStream { out ->
                def compressed = new org.tukaani.xz.XZOutputStream(out, options, org.tukaani.xz.XZ.CHECK_CRC32)
                compressed.write(bin.bytes)
                compressed.finish()
            }
            bin.delete()
        }
    }
}

tasks.named('preBuild') {
    dependsOn buildDictionary
}
