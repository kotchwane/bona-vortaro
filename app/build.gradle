apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "uk.co.busydoingnothing.prevo"

    compileSdk = 37

    defaultConfig {
        /* The ID of this modified version, so that it can be installed
         * next to the original PReVo of the Play Store. The code keeps
         * its package (the namespace above). */
        applicationId = "io.github.kotchwane.bonavortaro"
        minSdk = 23
        targetSdk = 34
        /* Bona vortaro starts again from 0.1, like PReVo did in 2012:
         * it is a new app for Android, with its own ID. The code must go
         * up with every version given to anyone. */
        versionCode = 1
        versionName = "0.1"
    }

   signingConfigs {
        release {
            storeFile = file(RELEASE_STORE_FILE)
            storePassword = RELEASE_STORE_PASSWORD
            keyAlias = RELEASE_KEY_ALIAS
            keyPassword = RELEASE_KEY_PASSWORD
        }
    }

    buildFeatures {
        compose = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

def buildDictionary = tasks.register('buildDictionary', Exec) {
    outputs.dir 'src/main/assets/articles'
    outputs.dir 'src/main/assets/indices'
    outputs.file 'src/main/res/xml/languages.xml'

    commandLine rootProject.file('scripts/generate-dictionary.sh')
}

tasks.named('preBuild') {
    dependsOn buildDictionary
}
