apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "io.github.kotchwane.bonavortaro"

    compileSdk = 37

    defaultConfig {
        /* The ID of this modified version, so that it can be installed
         * next to the original PReVo of the Play Store. The code keeps
         * its package (the namespace above). */
        applicationId = "io.github.kotchwane.bonavortaro"
        minSdk = 23
        targetSdk = 36
        /* Bona vortaro starts again from 0.1, like PReVo did in 2012:
         * it is a new app for Android, with its own ID. The code must go
         * up with every version given to anyone. */
        versionCode = 2
        versionName = "0.1.1"
    }

    /* The key, if there is one: the RELEASE_* properties in
     * ~/.gradle/gradle.properties. Without it (F-Droid, a fresh clone),
     * the release is built unsigned. */
    def releaseStoreFile = findProperty('RELEASE_STORE_FILE')
    def hasReleaseKey = releaseStoreFile != null && file(releaseStoreFile).exists()

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = findProperty('RELEASE_STORE_PASSWORD')
                keyAlias = findProperty('RELEASE_KEY_ALIAS')
                keyPassword = findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        compose = true
    }

    /* No encrypted list of the libraries, readable only by Google, in the
     * signature of the APKs: F-Droid refuses it. The bundle for Google
     * Play keeps it, Google reads it there */
    dependenciesInfo {
        includeInApk = false
    }

    buildTypes {
        release {
            if (hasReleaseKey)
                signingConfig = signingConfigs.release
            /* R8: shrinks and optimises the code (asked by F-Droid). The
             * libraries bring their own rules; ours are in proguard-rules.pro */
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        /* Built like the release, to test its speed from Android Studio:
         * signed with the debug key, so that the Run button works without
         * the release key, and installed next to the app, not over it */
        profile {
            initWith release
            signingConfig = signingConfigs.debug
            applicationIdSuffix = ".profile"
            versionNameSuffix = "-profile"
            matchingFallbacks = ['release']
            profileable = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}

def buildDictionary = tasks.register('buildDictionary', Exec) {
    outputs.dir 'src/main/assets/articles'
    outputs.dir 'src/main/assets/indices'
    outputs.file 'src/main/res/xml/languages.xml'

    commandLine rootProject.file('scripts/generate-dictionary.sh')
}

tasks.named('preBuild') {
    dependsOn buildDictionary
}
